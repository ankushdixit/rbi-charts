    <text x="24" y="75" font-size="20" font-weight="800" fill="#ffffff">The Death of Cash</text>
    <text x="24" y="100" font-size="13" fill="#64748b">Digital vs paper payment share</text>
    <text x="24" y="155" font-size="12" fill="#3b82f6">Read story →</text>
  </g>

  <g transform="translate(490, 1245)">
    <rect width="390" height="180" rx="12" fill="#0f172a"/>
    <text x="24" y="40" font-size="11" font-weight="600" fill="#fbbf24">Competition</text>
    <text x="24" y="75" font-size="20" font-weight="800" fill="#ffffff">Credit Card Wars</text>
    <text x="24" y="100" font-size="13" fill="#64748b">A 20-year bar chart race</text>
    <text x="24" y="155" font-size="12" fill="#3b82f6">Read story →</text>
  </g>

  <g transform="translate(900, 1245)">
    <rect width="390" height="180" rx="12" fill="#0f172a"/>
    <text x="24" y="40" font-size="11" font-weight="600" fill="#22d3ee">Market Share</text>
    <text x="24" y="75" font-size="20" font-weight="800" fill="#ffffff">Who Owns UPI?</text>
    <text x="24" y="100" font-size="13" fill="#64748b">Bank-wise UPI market share treemap</text>
    <text x="24" y="155" font-size="12" fill="#3b82f6">Read story →</text>
  </g>

  <!-- Footer -->
  <rect y="1490" width="1440" height="110" fill="#0f172a"/>
  <text x="80" y="1540" font-size="14" font-weight="700" fill="#ffffff">India in Charts</text>
  <text x="80" y="1565" font-size="12" fill="#64748b">Data from the Reserve Bank of India. Updated automatically. Free forever.</text>
  <text x="1200" y="1540" font-size="12" fill="#64748b">GitHub</text>
  <text x="1280" y="1540" font-size="12" fill="#64748b">About</text>
