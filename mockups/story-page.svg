<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1600" width="1440" height="1600">
  <defs>
    <linearGradient id="heroGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.02"/>
    </linearGradient>
  </defs>

  <!-- Page background -->
  <rect width="1440" height="1600" fill="#fafafa"/>

  <!-- ==================== STORY HERO ==================== -->
  <rect width="1440" height="420" fill="url(#heroGrad2)"/>

  <!-- Nav bar (minimal on story page) -->
  <text x="80" y="48" font-size="16" font-weight="700" fill="#94a3b8">India in Charts</text>
  <text x="1280" y="48" font-size="13" font-weight="500" fill="#64748b">All Stories</text>
  <line x1="80" y1="68" x2="1360" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Breadcrumb -->
  <text x="80" y="120" font-size="13" font-weight="500" fill="#64748b">Payments Revolution</text>
  <text x="230" y="120" font-size="13" fill="#475569">/</text>

  <!-- Story title -->
  <text x="80" y="195" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-2">The UPI Explosion</text>

  <!-- Subtitle -->
  <text x="80" y="240" font-size="18" fill="#94a3b8">From zero to 16 billion monthly transactions in under a decade.</text>
  <text x="80" y="268" font-size="18" fill="#94a3b8">The fastest adoption of any payment system in history.</text>

  <!-- Meta info -->
  <text x="80" y="320" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">DATA SOURCE</text>
  <text x="80" y="340" font-size="13" fill="#94a3b8">RBI Payment System Indicators, Monthly</text>

  <text x="350" y="320" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">LAST UPDATED</text>
  <text x="350" y="340" font-size="13" fill="#94a3b8">April 9, 2026</text>

  <text x="560" y="320" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">PERIOD</text>
  <text x="560" y="340" font-size="13" fill="#94a3b8">Apr 2016 — Feb 2026</text>

  <!-- Big stat on right -->
  <text x="1100" y="200" font-size="72" font-weight="900" fill="#3b82f6">16.6B</text>
  <text x="1100" y="230" font-size="16" fill="#64748b">transactions / month</text>
  <text x="1100" y="260" font-size="14" fill="#475569">February 2026</text>

  <!-- ==================== MAIN CHART AREA ==================== -->
  <rect x="60" y="450" width="1320" height="560" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Chart title inside -->
  <text x="100" y="495" font-size="18" font-weight="700" fill="#0f172a">UPI Transaction Volume</text>
  <text x="100" y="518" font-size="13" fill="#64748b">Monthly transactions in millions</text>

  <!-- Toolbar hints -->
  <rect x="1100" y="478" width="60" height="28" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1115" y="497" font-size="11" fill="#64748b">1Y</text>
  <rect x="1168" y="478" width="60" height="28" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1183" y="497" font-size="11" fill="#64748b">5Y</text>
  <rect x="1236" y="478" width="60" height="28" rx="6" fill="#3b82f6"/>
  <text x="1253" y="497" font-size="11" font-weight="600" fill="#ffffff">All</text>

  <!-- Y axis labels -->
  <text x="90" y="560" font-size="11" fill="#94a3b8" text-anchor="end">16,000</text>
  <text x="90" y="640" font-size="11" fill="#94a3b8" text-anchor="end">12,000</text>
  <text x="90" y="720" font-size="11" fill="#94a3b8" text-anchor="end">8,000</text>
  <text x="90" y="800" font-size="11" fill="#94a3b8" text-anchor="end">4,000</text>
  <text x="90" y="880" font-size="11" fill="#94a3b8" text-anchor="end">0</text>

  <!-- Grid lines -->
  <line x1="100" y1="555" x2="1340" y2="555" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="100" y1="635" x2="1340" y2="635" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="100" y1="715" x2="1340" y2="715" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="100" y1="795" x2="1340" y2="795" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="100" y1="875" x2="1340" y2="875" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Area chart - UPI growth curve -->
  <path d="M 100,875 L 100,870 200,868 300,862 400,850 500,835 600,810 700,775 800,730 900,680 1000,625 1100,580 1200,555 1340,540 1340,875 Z" fill="url(#areaFill)"/>
  <path d="M 100,870 L 200,868 300,862 400,850 500,835 600,810 700,775 800,730 900,680 1000,625 1100,580 1200,555 1340,540" stroke="#3b82f6" stroke-width="3" fill="none"/>

  <!-- Data point with tooltip -->
  <circle cx="1340" cy="540" r="5" fill="#3b82f6"/>
  <circle cx="1340" cy="540" r="10" fill="#3b82f6" opacity="0.15"/>

  <!-- Tooltip box -->
  <rect x="1200" y="495" width="130" height="40" rx="8" fill="#0f172a"/>
  <text x="1215" y="513" font-size="11" fill="#94a3b8">Feb 2026</text>
  <text x="1215" y="529" font-size="13" font-weight="700" fill="#ffffff">16,584 Mn</text>
  <!-- Tooltip arrow -->
  <polygon points="1260,535 1270,545 1250,545" fill="#0f172a"/>

  <!-- Milestone annotations -->
  <line x1="300" y1="555" x2="300" y2="875" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="305" y="570" font-size="10" font-weight="600" fill="#94a3b8">UPI</text>
  <text x="305" y="582" font-size="10" fill="#94a3b8">launches</text>

  <line x1="550" y1="555" x2="550" y2="875" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="555" y="570" font-size="10" font-weight="600" fill="#94a3b8">Demon-</text>
  <text x="555" y="582" font-size="10" fill="#94a3b8">etization</text>

  <line x1="770" y1="555" x2="770" y2="875" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="775" y="570" font-size="10" font-weight="600" fill="#94a3b8">COVID</text>
  <text x="775" y="582" font-size="10" fill="#94a3b8">lockdown</text>

  <!-- X axis labels -->
  <text x="100" y="900" font-size="11" fill="#94a3b8">2016</text>
  <text x="350" y="900" font-size="11" fill="#94a3b8">2018</text>
  <text x="600" y="900" font-size="11" fill="#94a3b8">2020</text>
  <text x="850" y="900" font-size="11" fill="#94a3b8">2022</text>
  <text x="1100" y="900" font-size="11" fill="#94a3b8">2024</text>
  <text x="1300" y="900" font-size="11" fill="#94a3b8">2026</text>

  <!-- Data zoom slider -->
  <rect x="100" y="930" width="1240" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="100" y="930" width="1240" height="30" rx="4" fill="#3b82f6" opacity="0.05"/>
  <!-- Mini chart in zoom -->
  <path d="M 100,955 L 300,953 500,948 700,940 900,930 1100,935 1340,930" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.3"/>
  <!-- Zoom handles -->
  <rect x="96" y="928" width="8" height="34" rx="4" fill="#3b82f6" opacity="0.5"/>
  <rect x="1336" y="928" width="8" height="34" rx="4" fill="#3b82f6" opacity="0.5"/>

  <!-- ==================== INSIGHT TEXT ==================== -->
  <g transform="translate(80, 1010)">
    <text x="0" y="0" font-size="13" font-weight="600" fill="#3b82f6" letter-spacing="1">KEY INSIGHT</text>
    <text x="0" y="35" font-size="22" font-weight="700" fill="#0f172a">UPI processed more transactions in a single month</text>
    <text x="0" y="65" font-size="22" font-weight="700" fill="#0f172a">than Visa and Mastercard combined do globally.</text>
    <text x="0" y="100" font-size="15" fill="#64748b">In February 2026, UPI handled 16.6 billion transactions worth Rs 23.4 lakh crore (~$275 billion).</text>
    <text x="0" y="125" font-size="15" fill="#64748b">India now accounts for 46% of all real-time payment transactions worldwide.</text>
  </g>

  <!-- ==================== RELATED STORIES ==================== -->
  <line x1="80" y1="1180" x2="1360" y2="1180" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="1220" font-size="13" font-weight="600" fill="#64748b" letter-spacing="1">CONTINUE EXPLORING</text>

